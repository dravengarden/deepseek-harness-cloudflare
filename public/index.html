<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>DeepSeek Harness</title>
    <script>
      (function () {
        var q = new URLSearchParams(location.search).get("ui");
        if (q === "desktop") return;
        if (q === "mobile" || matchMedia("(max-width: 800px)").matches) location.replace("/m");
      })();
    </script>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-ds-dark-theme>
    <section id="login" class="boot" hidden>
      <div class="boot-card">
        <p class="wordmark">DEEPSEEK HARNESS</p>
        <p class="boot-hint">Local wrangler uses an access key. Production uses Cloudflare Access.</p>
        <label>
          Access key
          <input id="access-key" type="text" autocomplete="off" autocorrect="off" spellcheck="false" />
        </label>
        <button id="login-btn" type="button">Continue</button>
        <p id="login-error" class="error" hidden></p>
      </div>
    </section>

    <div id="app" class="workbench" hidden>
      <aside class="rail" id="rail">
        <button id="toggle-rail" class="icon-btn" type="button" title="Workbench">☰</button>
        <button id="new-session" class="icon-btn" type="button" title="New session">+</button>
        <div class="rail-spacer"></div>
        <button id="logout-btn" class="icon-btn" type="button" title="Sign out">⎋</button>
      </aside>
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-head">
          <p class="wordmark">DEEPSEEK HARNESS</p>
          <button id="new-session-wide" type="button">New session</button>
        </div>
        <nav id="session-list" class="session-list"></nav>
      </aside>
      <section class="stage">
        <header class="stage-bar">
          <div>
            <h1 id="session-title">New session</h1>
            <p id="session-meta" class="hint"></p>
          </div>
          <div class="stage-actions">
            <label class="inline">
              Permissions
              <select id="permission">
                <option value="workspace-write">workspace-write</option>
                <option value="danger-full-access">danger-full-access</option>
              </select>
            </label>
            <span id="user-email" class="hint"></span>
            <button id="compact-btn" class="ghost" type="button">Compact</button>
            <button id="fork-btn" class="ghost" type="button">Fork</button>
            <button id="cancel-btn" class="ghost" type="button">Stop</button>
          </div>
        </header>
        <div id="transcript" class="transcript" aria-live="polite"></div>
        <form id="composer" class="composer">
          <textarea id="prompt" rows="3" placeholder="Message DeepSeek Harness. /compact /plan /permission"></textarea>
          <div id="slash-menu" class="slash-menu" hidden></div>
          <div class="composer-row">
            <p id="composer-hint" class="hint"></p>
            <button type="submit">Send</button>
          </div>
        </form>
      </section>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
